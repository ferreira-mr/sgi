name: ${COMPOSE_PROJECT_NAME:-sgi-test}

x-test-environment: &test-environment
  SGI_APP_ENV: test
  SGI_APP_DEBUG: "0"
  SGI_DB_HOST: db
  SGI_DB_PORT: "3306"
  SGI_DB_NAME: ${SGI_TEST_DB_NAME:-sgi_test}
  SGI_DB_USER: root
  SGI_DB_PASSWORD: ${SGI_DB_PASSWORD:-sgi-test-only}
  SGI_TEST_DB_NAME: ${SGI_TEST_DB_NAME:-sgi_test}
  SGI_TEST_DB_RUNTIME: container
  SGI_TEST_RESULTS_DIR: /app/test-results
  SGI_TEST_RUN_ID: ${SGI_TEST_RUN_ID:-compose}
  SGI_TEST_INTEGRATION_SCENARIO: ${SGI_TEST_INTEGRATION_SCENARIO:-}
  SGI_TEST_DEFER_SIMULATION: ${SGI_TEST_DEFER_SIMULATION:-0}
  SGI_SIMULATION_PHASE: ${SGI_SIMULATION_PHASE:-complete}
  SGI_SIMULATION_RUN_ID: ${SGI_SIMULATION_RUN_ID:-}
  SGI_TEST_PRESERVE_DATABASE: ${SGI_TEST_PRESERVE_DATABASE:-0}
  SGI_E2E_RESET: "0"
  SGI_TEST_BASE_URL: http://sgi-web:8099
  SGI_BASE_URL: http://sgi-web:8099/
  SGI_BASE_PATH: ""
  SGI_UPLOAD_DIR: /app/test-results/uploads
  SGI_REGULAMENTOS_DIR: /app/test-results/uploads/regulamentos
  SGI_FOTOS_DIR: /app/test-results/uploads/fotos
  SGI_IMPORT_DIR: /app/test-results/imports
  SGI_SESSION_DIR: /app/test-results/sessions
  SGI_UPLOAD_TMP_DIR: /app/test-results/upload-tmp
  SGI_MYSQL_PATH: sgi-mysql
  SGI_MYSQLDUMP_PATH: sgi-mysqldump

x-php-test-service: &php-test-service
  build:
    context: .
    dockerfile: Dockerfile.test
    args:
      PHP_VERSION: ${SGI_PHP_VERSION:-8.4}
  image: sgi-test-php:${SGI_PHP_VERSION:-8.4}
  working_dir: /app
  environment: *test-environment
  volumes:
    - type: bind
      source: ${SGI_TEST_RESULTS_DIR:-./test-results}
      target: /app/test-results
    - test_sessions:/app/test-results/sessions

x-browser-test-service: &browser-test-service
  build:
    context: .
    dockerfile: Dockerfile.browser
  image: sgi-test-browser:1.62.1
  working_dir: /app
  environment:
    <<: *test-environment
    SGI_INDIVIDUAL_BROWSER: "1"
    SGI_BROWSER_REQUIRES_DATABASE: "1"
    SGI_BROWSER_JSON_REPORT: ${SGI_BROWSER_JSON_REPORT:-/app/test-results/browser-playwright.json}
  volumes:
    - type: bind
      source: ${SGI_TEST_RESULTS_DIR:-./test-results}
      target: /app/test-results
    - type: bind
      source: ${SGI_TEST_BROWSER_RESULTS_DIR:-./tests/browser/test-results}
      target: /app/tests/browser/test-results
    - type: bind
      source: ${SGI_TEST_BROWSER_REPORT_DIR:-./tests/browser/playwright-report}
      target: /app/tests/browser/playwright-report

services:
  db:
    image: ${SGI_DB_IMAGE:-mariadb:10.11}
    labels:
      com.sgi.test.disposable: "true"
      com.sgi.test.run-id: ${SGI_TEST_RUN_ID:-compose}
    environment:
      MYSQL_ROOT_PASSWORD: ${SGI_DB_PASSWORD:-sgi-test-only}
      MYSQL_DATABASE: ${SGI_TEST_DB_NAME:-sgi_test}
      MARIADB_ROOT_PASSWORD: ${SGI_DB_PASSWORD:-sgi-test-only}
      MARIADB_DATABASE: ${SGI_TEST_DB_NAME:-sgi_test}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "if command -v mysqladmin >/dev/null 2>&1; then mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent; else mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent; fi"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  app:
    <<: *php-test-service
    networks:
      default:
        aliases:
          - sgi-web
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8099"
    ports:
      - "${SGI_TEST_BIND_ADDRESS:-127.0.0.1}:${SGI_TEST_HOST_PORT:-8099}:8099"
    command:
      - php
      - -d
      - session.save_path=/app/test-results/sessions
      - -d
      - upload_tmp_dir=/app/test-results/upload-tmp
      - -d
      - display_errors=0
      - -d
      - display_startup_errors=0
      - -d
      - log_errors=1
      - -d
      - error_log=/proc/self/fd/2
      - -S
      - 0.0.0.0:8099
      - -t
      - public
      - public/index.php
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8099/api/v1/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 3s

  quality:
    <<: *php-test-service
    environment:
      SGI_APP_ENV: test
      SGI_APP_DEBUG: "0"
    command:
      - sh
      - -lc
      - |
        set -e
        composer validate --no-check-publish
        composer verify
        npm run check
        npm test

  integration:
    <<: *php-test-service
    environment:
      <<: *test-environment
      SGI_SESSION_DIR: ""
    depends_on:
      app:
        condition: service_healthy
    command:
      - php
      - -d
      - session.save_path=/app/test-results/sessions
      - tests/run_all.php

  browser:
    <<: *browser-test-service
    depends_on:
      app:
        condition: service_healthy
    command: ["npm", "--prefix", "tests/browser", "test", "--", "--grep-invert", "contrato visual do acesso"]

  browser-simulation:
    <<: *browser-test-service
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *test-environment
      SGI_INDIVIDUAL_BROWSER: "1"
      SGI_BROWSER_REQUIRES_DATABASE: "1"
      SGI_RUN_SIMULATION_PORTAL: "1"
      SGI_BROWSER_JSON_REPORT: /app/test-results/simulation-browser-playwright.json
    command: ["npm", "--prefix", "tests/browser", "test", "--", "--project=simulation", "--grep", "224 alunos autenticam"]

  browser-simulation-events:
    <<: *browser-test-service
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *test-environment
      SGI_INDIVIDUAL_BROWSER: "1"
      SGI_BROWSER_REQUIRES_DATABASE: "1"
      SGI_RUN_SIMULATION_PORTAL: "1"
      SGI_BROWSER_JSON_REPORT: /app/test-results/simulation-events-playwright.json
    command: ["npm", "--prefix", "tests/browser", "test", "--", "--project=simulation", "--grep", "opera a edição preparada"]

  visual:
    <<: *browser-test-service
    depends_on:
      app:
        condition: service_healthy
    command: ["npm", "--prefix", "tests/browser", "test", "--", "visual-contract.spec.cjs"]

volumes:
  test_sessions:
