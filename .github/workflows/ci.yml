name: SGI CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SGI_PHP_VERSION: '8.4'
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração Docker
        run: docker compose -f compose.test.yml config --quiet
      - name: Construir executor PHP/Node
        run: docker compose -f compose.test.yml build app
      - name: Executar qualidade PHP e JavaScript
        run: docker compose -f compose.test.yml run --rm --no-deps quality
      - name: Limpar executor
        if: always()
        run: docker compose -f compose.test.yml down --volumes --remove-orphans

  integration:
    runs-on: ubuntu-latest
    env:
      SGI_DB_IMAGE: mariadb:10.11
      SGI_PHP_VERSION: '8.4'
      SGI_DB_PASSWORD: root
      SGI_TEST_DB_NAME: sgi_test
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração Docker
        run: docker compose -f compose.test.yml config --quiet
      - name: Construir aplicação e navegador
        run: docker compose -f compose.test.yml build app browser
      - name: Preparar diretórios de saída
        run: mkdir -p test-results tests/browser/test-results tests/browser/playwright-report
      - name: Subir banco e servidor HTTP
        run: docker compose -f compose.test.yml up -d --wait db app
      - name: Executar integração HTTP, banco e recuperação
        run: docker compose -f compose.test.yml run --rm --no-deps integration
      - name: Navegação, permissões e torneios online/offline
        run: docker compose -f compose.test.yml run --rm --no-deps browser
      - name: Registrar logs Docker em caso de falha
        if: failure()
        run: |
          sudo chown -R $USER:$USER test-results tests/browser/test-results tests/browser/playwright-report 2>/dev/null || true
          mkdir -p test-results
          docker compose -f compose.test.yml logs --no-color app db > test-results/docker-compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-results/*.log
            test-results/integration-timings.json
            test-results/*playwright.json
            tests/browser/test-results/
            tests/browser/playwright-report/
      - name: Limpar ambiente descartável
        if: always()
        run: docker compose -f compose.test.yml down --volumes --remove-orphans

  visual:
    runs-on: ubuntu-latest
    env:
      SGI_DB_IMAGE: mariadb:10.11
      SGI_PHP_VERSION: '8.4'
      SGI_DB_PASSWORD: root
      SGI_TEST_DB_NAME: sgi_test
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração Docker
        run: docker compose -f compose.test.yml config --quiet
      - name: Construir aplicação e executor visual
        run: docker compose -f compose.test.yml build app browser
      - name: Preparar diretórios de saída
        run: mkdir -p test-results tests/browser/test-results tests/browser/playwright-report
      - name: Subir banco e servidor HTTP
        run: docker compose -f compose.test.yml up -d --wait db app
      - name: Comparar imagens aprovadas no Linux
        run: docker compose -f compose.test.yml run --rm --no-deps visual
      - name: Registrar logs Docker em caso de falha
        if: failure()
        run: |
          sudo chown -R $USER:$USER test-results tests/browser/test-results tests/browser/playwright-report 2>/dev/null || true
          mkdir -p test-results
          docker compose -f compose.test.yml logs --no-color app db > test-results/docker-compose-visual.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-contract-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            test-results/*.log
            test-results/integration-timings.json
            test-results/*playwright.json
            tests/browser/test-results/
            tests/browser/playwright-report/
      - name: Limpar ambiente descartável
        if: always()
        run: docker compose -f compose.test.yml down --volumes --remove-orphans
